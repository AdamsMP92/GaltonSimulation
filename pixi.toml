[workspace]
name = "galton-simulation"
version = "0.1.0"
description = "A Galton board simulation."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
MPLCONFIGDIR = "$PIXI_PROJECT_ROOT/.pixi/matplotlib"

[tasks]
test = "pytest -q"
simulate = "python scripts/run_single.py"
scan-start-grid = "python scripts/run_start_grid_scan.py"
compare-gaussian-kde = "python scripts/compare_gaussian_kde.py"

[dependencies]
python = ">=3.12,<3.14"
numpy = "*"
scipy = "*"
matplotlib = "*"
pytest = "*"

[pypi-dependencies]
galton-simulation = { path = ".", editable = true }
